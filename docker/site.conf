<VirtualHost *:80>
    DocumentRoot /web/public
    DirectoryIndex index.php
    ErrorDocument 404 /404.html
    <Directory /web/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        LimitRequestBody 2097152
    </Directory>
    <Directory /web/data>
        Require all denied
    </Directory>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
